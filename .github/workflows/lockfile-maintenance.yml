name: Lockfile maintenance

on: # zizmor: ignore[dangerous-triggers] -- PR events only validate and dispatch; no PR checkout or execution.
  workflow_dispatch:
    inputs:
      request-comment:
        description: Rebase request comment ID (set by the request job).
        type: string
        default: ''
      request-pull-request:
        description: Rebase request PR number (set by the request job).
        type: string
        default: ''
  issue_comment:
    types: [created]
  pull_request_target:
    types: [edited]
  schedule:
    - cron: "0 0 * * 5" # Friday 09:00 JST

permissions:
  contents: read

jobs:
  request-rebase:
    if: >-
      github.event.sender.type == 'User' &&
      (github.event_name == 'issue_comment' || github.event_name == 'pull_request_target')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      issues: write
      pull-requests: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: knu/lockfile-maintenance-action/request-rebase@4d57efa0d0722dfb41fe99752fc6146cfb43ca56 # v1.0.2

  maintain:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    concurrency:
      group: lockfile-maintenance
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
      issues: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false

      - uses: knu/lockfile-maintenance-action@4d57efa0d0722dfb41fe99752fc6146cfb43ca56 # v1.0.2
        with:
          request-comment: ${{ inputs.request-comment }}
          request-pull-request: ${{ inputs.request-pull-request }}
          auth: oidc
          files: /pnpm-lock.yaml
          minimum-release-age: 3 days
